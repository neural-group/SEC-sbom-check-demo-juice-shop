# SBOMを作り、OSV.dev の脆弱性データベースと突き合わせる。
#   1. npm sbom でロックファイルから SBOM (CycloneDX) を生成
#   2. sbom_check.py で SBOM の部品を OSV.dev に問い合わせ
#   3. 既知の脆弱性が1件でもあればジョブを失敗させる
name: SBOM Check

on:
  pull_request:            # PRを出したとき
  push:
    branches: [develop]     # デフォルトブランチに push したとき
  schedule:
    - cron: "17 0 * * 1"   # 毎週月曜 9:17 JST（cron は UTC 指定）
  workflow_dispatch:       # 手動実行

permissions:
  contents: read           # 必要最小限の権限だけ渡す

jobs:
  sbom-check:
    name: SBOM Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false     # 片方が失敗しても、もう片方の結果を最後まで出す
      matrix:
        include:
          - name: backend
            dir: .
          - name: frontend
            dir: frontend
    steps:
      # 他の人が作った部品（アクション）は、タグではなくコミットSHAで固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: SBOMを生成
        working-directory: ${{ matrix.dir }}
        run: npm sbom --sbom-format cyclonedx --package-lock-only > "$RUNNER_TEMP/sbom-${{ matrix.name }}.cdx.json"

      - name: SBOMを保存（あとで「あの時点の構成」を確認できるように）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: ${{ runner.temp }}/sbom-${{ matrix.name }}.cdx.json
          retention-days: 90

      - name: 脆弱性データベースと突き合わせ
        shell: bash          # パイプの途中で失敗したら、ステップも失敗させる
        run: |
          {
            echo "## SBOM Check: ${{ matrix.name }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 sbom_check.py "$RUNNER_TEMP/sbom-${{ matrix.name }}.cdx.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary を閉じる
        if: always()
        run: echo '```' >> "$GITHUB_STEP_SUMMARY"
